name: Build

on:
  push:
    branches: [ "ver/26.3" ]
  pull_request:
    branches: [ "ver/26.3" ]
  workflow_dispatch:

env:
  MC_VERSION: "26.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Create Paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Name the jar
        id: jar
        run: |
          NAME="kindling-${MC_VERSION}-${{ github.run_number }}.jar"
          mv leaf-server/build/libs/leaf-paperclip-${MC_VERSION}*.jar "./$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$NAME" | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          path: ./${{ steps.jar.outputs.name }}
          archive: false

      - name: Release
        if: github.event_name == 'push' && github.repository == 'jonax1337/KindlingMC'
        uses: softprops/action-gh-release@v3
        with:
          name: "Kindling ${{ env.MC_VERSION }} build ${{ github.run_number }}"
          tag_name: "${{ env.MC_VERSION }}-${{ github.run_number }}"
          target_commitish: "${{ github.sha }}"
          files: ./${{ steps.jar.outputs.name }}
          generate_release_notes: true
          append_body: true
          body: |
            Minecraft ${{ env.MC_VERSION }}, based on Leaf. SHA-256: `${{ steps.jar.outputs.sha256 }}`
          prerelease: true
