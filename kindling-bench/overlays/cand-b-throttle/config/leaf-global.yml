# candidate B plus throttled natural spawning (changes spawn rates where attempts keep failing)
async:
  async-entity-tracker:
    enabled: true
  async-pathfinding:
    enabled: true
  async-playerdata-save:
    enabled: true
performance:
  cache-biome:
    enabled: true
    mob-spawning: true
    advancements: true
  optimize-mob-despawn: true
  optimize-entity-activation: true
  optimize-mob-spawning: true
  sleeping-block-entity: true
  reuse-random-ticking-blockpos: true
  optimized-powered-rails: true
  optimize-waypoint: true
  throttle-mob-spawning:
    enabled: true
