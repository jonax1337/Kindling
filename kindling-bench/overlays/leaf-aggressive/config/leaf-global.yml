# leaf-safe plus the features that change mob behaviour: DAB (far mobs think less often) and throttled spawning.
async:
  async-entity-tracker:
    enabled: true
  async-pathfinding:
    enabled: true
  async-playerdata-save:
    enabled: true
performance:
  dab:
    enabled: true
  throttle-mob-spawning:
    enabled: true
  cache-biome:
    enabled: true
    mob-spawning: true
    advancements: true
  optimize-mob-despawn: true
  optimize-entity-activation: true
  optimize-mob-spawning: true
  sleeping-block-entity: true
  reuse-random-ticking-blockpos: true
  optimized-powered-rails: true
  optimize-waypoint: true
  faster-random-generator:
    enabled: true
